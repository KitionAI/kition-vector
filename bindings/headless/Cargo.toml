[package]
name = "kition-vector"
description = "The Vector kit for Kition's agent: the Kition SDK document served headless over the Kit Protocol."
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
publish = false

[lints]
workspace = true

[dependencies]
kition-vector-kit = { path = "../wasm" }
kition-headless = { workspace = true }

[dev-dependencies]
kition-kit = { workspace = true, features = ["session"] }
kition-kit-server = { workspace = true }
serde_json = { workspace = true }
# workspace_only.rs: the test builds its hostile drawings with the engine, outside the kit, and
# reads the pictures the kit answers.
kition-vector-engine = { workspace = true }
image = { workspace = true }
# outside.rs: the agent drives the kit through the kits' MCP tools while another program rewrites the file.
kition-kits = { workspace = true }
# document.identity and document.fork through the real process (tests/identity.rs).
kition-kit-host = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
