format: 1
id: vector.agent.draft/stroked-box
feature: vector.agent.draft
intent: >-
  Over two messages the agent draws a shape in a draft for the person to review and then changes
  its stroke there; the drawing itself keeps its two shapes (KHP Recover, A12–A14).
layer: eval
source:
  kind: synthetic
  from: repo:conformance/basic.kvector
  license: Apache-2.0
  note: A copy of the conformance drawing the vector engine writes (one 200×100 artboard; an 80×50 rectangle and a 50×50 ellipse).
input: [input/shapes.kvector]
steps:
  - task:
      turns:
        - >-
          As a draft for me to review (leave shapes.kvector itself unchanged), draw a 30 by 15
          point rectangle at x 40, y 75 in shapes.kvector.
        - In the same draft, give that new rectangle a 4-point stroke.
      max_turns: 25
  - inspect: { path: shapes.kvector, args: { draft: true }, as: draft, missing_ok: true }
  - inspect: { path: shapes.kvector, as: after }
expected:
  - actual: out:draft
    compare: values
    value:
      details.layers.0.children: { count: 3 }
      details.layers.0.children.0.kind: Rectangle
      details.layers.0.children.0.strokeWidth: 4
  - actual: out:after
    compare: values
    collateral: true
    value:
      details.layers.0.children: { count: 2 }
solution:
  - tool: vector_run
    args: { path: shapes.kvector, draft: true, steps: [{ command: shape.rectangle, params: { x: 40, y: 75, width: 30, height: 15 } }] }
  - tool: vector_run
    args: { path: shapes.kvector, draft: true, steps: [{ command: stroke.set, params: { ids: [4], weight: 4 } }] }
since: "2026-11-17"
timeout_s: 600
