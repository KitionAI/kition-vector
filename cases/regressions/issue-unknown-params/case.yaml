intent: >-
  Every command with a parameter schema refuses a key its schema does not name, saying which and
  the parameter it resembles, before it changes anything (engine rule E7a, kit requirement AX15):
  201 commands ran with a misspelled key and ignored it, and the Stroke panel's weight field sent
  `width`, which stroke.set never read.
