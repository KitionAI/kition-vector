id: regressions/issue-layer-rows
feature: vector.editor.layers
intent: >-
  inspect reports the Layers panel's current layer and highlighted rows. Before, the binding read
  them from a scratch session that never copied them: currentLayer stayed the drawing's first layer
  and layerRows was always empty whatever the panel clicked, so the panel could not show which rows
  its Delete, Duplicate and Options act on.
