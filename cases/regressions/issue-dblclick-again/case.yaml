format: 1
id: regressions/issue-dblclick-again
feature: vector.editor.type
intent: >-
  Type just edited (typed into, Escape, V) and double-clicked again with the Selection tool at the
  same place gets the caret there again. Before, the Type tool still counted its last clicks there,
  so the click the double-click handed it was a second one and selected the word, which the next key
  replaced (re-walk 2026-11-26: "Hello" became "??!!llo").
