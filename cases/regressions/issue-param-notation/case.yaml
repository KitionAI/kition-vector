format: 1
id: regressions/issue-param-notation
feature: vector.agent.recover
intent: >-
  Every entry of a command's parameter notation is a key the SDK's parser reads, so the command's
  schema has the parameter and a call passing it is not refused as unknown: 30 commands had
  entries the parser could not read (`sides=6`, `jpg: quality?: 90`, `ids?|id + start?/end?`,
  prose split at a comma) or a notation that is no object (`same as effect.apply: {…}`), and
  kition-sdk's check_commands did not see them because this kit completes the schemas after
  converting the notation; file.export refused `ppi`, `quality`, `colors` and `lossless`,
  file.save `compress` and `separateArtboards`, shape.flare `diameter`.
layer: gate
source: {kind: synthetic, from: kition-sdk e1c9598 (unreadable notation entries), license: Apache-2.0}
input: []
steps:
  - cargo-test: {package: kition-vector-kit, test: commands}
expected:
  - {actual: exit, compare: exit, value: 0}
since: "2026-11-22"
