format: 1
id: regressions/issue-deterministic-save
feature: vector.agent.act
intent: >-
  A drawing built by the same commands saves the same bytes in a reproducible build (a showcase
  sample, a gating test): the document's creation time is SOURCE_DATE_EPOCH, and with kition-kit's
  reproducible-ids feature (dev-dependencies only) and KITION_REPRODUCIBLE_IDS set, the document
  id, the replica's actor and new objects' ids are counted from that seed (kition-sdk 8d56412;
  SOURCE_DATE_EPOCH alone no longer changes ids). Before, file.new stamped the wall clock into
  metadata.created, so every build of a sample saved other bytes.
layer: gate
source:
  kind: probe
  from: kition-showcase round-2 rebuild (vector samples saved other bytes on every build)
  license: owned
input: []
steps:
  - cargo-test: { package: kition-vector-kit, test: deterministic_save }
expected:
  - actual: out:cargo-test
    compare: exit
    value: 0
since: "2026-11-17"
