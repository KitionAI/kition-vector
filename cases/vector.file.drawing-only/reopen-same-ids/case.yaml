id: vector.file.drawing-only/reopen-same-ids
feature: vector.file.drawing-only
intent: >-
  An unchanged drawing saves to the bytes it was opened from, whether it opens alone or on the
  replica the host stored for it, and reopening keeps every object's id: the drawing's own ids and
  the replica's object ids, with no import change written for a file the replica already holds
  (plain document model, plan 2026-11-24).
