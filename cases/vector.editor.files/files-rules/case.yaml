intent: >-
  The file rules hold without a browser (plan 2026-11-25, stage 7): Open and Place offer the
  drawings and pictures the engine reads; a drawing read from another format saves as a .kvector
  beside it, and the engine's refusal to save over the SVG reads as a sentence of the editor's own; a
  paste takes SVG before PDF before a picture before text; a copy offers SVG markup, a type-only
