  second and Cancel drops its result; made-up Layers names show in Chinese. In the built engine:
  every Export setting is one the engine takes, SVG text as outlines leaves no <text>, PNG at 2x has
  twice the pixels, pasted SVG, pictures and text come in as one step each, and a drawing read from
  SVG is written as a .kvector that opens again.
