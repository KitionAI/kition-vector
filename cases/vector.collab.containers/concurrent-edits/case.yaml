intent: Where the drawing holds a collection, not one value, the replica holds a KDM container. A type object's characters are its text, not its data; a threaded story is one text, however it flows through its frames, and unthreading gives each frame its own text again; a symbol's art is the symbol's tree and goes with it. Edits made on two replicas one after the other (typing at both ends of a story, editing two objects of one symbol) reach both, and both replicas hold the same drawing.
